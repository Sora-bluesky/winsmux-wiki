name: Deps check

# 週 1 回、依存と deploy.yml の固定版（Node・wrangler）が遅れていないかを見る。
# 遅れがあれば issue を 1 本だけ開いて本文を更新し、遅れが無くなったら閉じる。何も書き換えない。
on:
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - id: check
        run: |
          set +e
          node scripts/deps-check.mjs "$RUNNER_TEMP/report.md"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "behind=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 10 ]; then echo "behind=true" >> "$GITHUB_OUTPUT"
          else exit "$rc"; fi

      - env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.check.outputs.behind }}
          TITLE: 依存の更新があります（週次の版確認）
        run: |
          num=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ "$BEHIND" = "true" ]; then
            { cat "$RUNNER_TEMP/report.md"; echo; echo "確認: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > "$RUNNER_TEMP/body.md"
            if [ -n "$num" ]; then gh issue edit "$num" --body-file "$RUNNER_TEMP/body.md"
            else gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "遅れが無くなりました（${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）"
          fi
