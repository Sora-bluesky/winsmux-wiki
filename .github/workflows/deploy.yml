name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # build には Cloudflare のトークンを渡さない。サイト依存（astro / tailwind / pagefind …）の
  # install script が動くのはこのジョブだけ。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap の lastmod を git 履歴から取るため（shallow だと全ページが同じ日付になる）

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          include-hidden-files: true # ディスク上の dist をそのまま渡す現行と同じにする
          retention-days: 1

  # deploy は wrangler.toml と dist だけを持つ。package.json を見せず（npm install で
  # サイト依存が戻るのを防ぐ）、版固定の wrangler をトークン無しの step で入れてから deploy する。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: wrangler.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - run: |
          mkdir -p "$WRANGLER_HOME"
          npm install --prefix "$WRANGLER_HOME" wrangler@4.88.0
        env:
          WRANGLER_HOME: ${{ runner.temp }}/w

      - run: '"$WRANGLER_HOME/node_modules/.bin/wrangler" deploy'
        env:
          WRANGLER_HOME: ${{ runner.temp }}/w
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
